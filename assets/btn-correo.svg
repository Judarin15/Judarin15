<svg xmlns="http://www.w3.org/2000/svg" width="236" height="52" viewBox="0 0 236 52" role="img" aria-label="Escribirme"><title>Escribirme</title><style>@font-face{font-family:'VT';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PX';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PX';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.vt{font-family:'VT','Courier New',monospace}
.px{font-family:'PX','Consolas','Courier New',monospace}
.hi{fill:#c8ffdd} .ph{fill:#4dff91} .mid{fill:#36c476}
.glow{filter:url(#glow)}
.scan{animation:flicker 6s steps(1,end) infinite}
.roll{animation:roll 9s linear infinite}
.blink{animation:blink 1.05s steps(1,end) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes flicker{0%{opacity:.55}7%{opacity:.45}8%{opacity:.6}43%{opacity:.5}44%{opacity:.56}71%{opacity:.48}72%{opacity:.58}}
@keyframes roll{from{transform:translateY(-40%)}to{transform:translateY(140%)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ring{animation:ring 2.4s ease-in-out infinite}@keyframes ring{50%{stroke-opacity:.35}}</style><defs><pattern id="scanp" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".5"/></pattern></defs><rect x="1" y="1" width="234" height="50" fill="#020d07" stroke="#4dff91" stroke-width="2" class="ring"/><g transform="translate(22 16)" style="color:#c8ffdd"><rect x="0" y="3" width="20" height="14" fill="none" stroke="currentColor" stroke-width="2"/><path d="M0 4l10 7 10-7" fill="none" stroke="currentColor" stroke-width="2"/></g><text x="56" y="32" font-size="16" class="px" font-weight="600" fill="#c8ffdd">Escribirme</text><rect x="1" y="1" width="234" height="50" fill="url(#scanp)" opacity=".35"/></svg>
