<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Trayectoria: ago 2026, Grado como Tecnólogo en Análisis y Desarrollo de Software, SENA; ene 2026 – jul 2026, Practicante de apoyo de sistemas, Gimnasio Campestre Comfaoriente, Cúcuta; jul 2024 – hoy, Ingeniería de Sistemas, Universidad de Pamplona; feb 2024 – hoy, Auxiliar de ingeniería, Ing. Civil Mauricio Bolívar Cuéllar, Cúcuta; dic 2022, Inglés nivel B1, Academia Inglés Para Todos">
<title>Trayectoria</title>
<style>@font-face{font-family:'VT';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PX';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PX';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.vt{font-family:'VT','Courier New',monospace}
.px{font-family:'PX','Consolas','Courier New',monospace}
.hi{fill:#c8ffdd} .ph{fill:#4dff91} .mid{fill:#36c476}
.glow{filter:url(#glow)}
.scan{animation:flicker 6s steps(1,end) infinite}
.roll{animation:roll 9s linear infinite}
.blink{animation:blink 1.05s steps(1,end) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes flicker{0%{opacity:.55}7%{opacity:.45}8%{opacity:.6}43%{opacity:.5}44%{opacity:.56}71%{opacity:.48}72%{opacity:.58}}
@keyframes roll{from{transform:translateY(-40%)}to{transform:translateY(140%)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.row{animation:print .7s cubic-bezier(.23,1,.32,1) both}@keyframes print{0%{opacity:.35;transform:translateX(-8px)}40%{opacity:1;filter:brightness(2.2)}100%{opacity:1;filter:none;transform:none}}</style>
<defs>
  <pattern id="scanp" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".5"/></pattern>
  <radialGradient id="bloom" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#4dff91" stop-opacity=".09"/><stop offset=".55" stop-color="#4dff91" stop-opacity=".02"/><stop offset="1" stop-color="#4dff91" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  <linearGradient id="rollg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4dff91" stop-opacity="0"/><stop offset=".6" stop-color="#4dff91" stop-opacity=".07"/><stop offset="1" stop-color="#4dff91" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="1" y="1" width="958" height="398" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="960" height="400" fill="#020d07"/>
<line x1="0" y1="40" x2="960" y2="40" stroke="#1d6e42"/><text x="24" y="26" font-size="13" class="px hi" font-weight="600" letter-spacing=".5">registro.log</text><text x="936" y="26" font-size="12" class="px mid" text-anchor="end">formación y experiencia</text>
<text x="28" y="88" font-size="44" class="vt glow"><tspan class="mid">~/</tspan><tspan class="hi">trayectoria</tspan></text>
<g class="row" style="animation-delay:0.30s"><line x1="28" y1="108" x2="932" y2="108" stroke="#1d6e42" stroke-opacity=".6"/><text x="28" y="130" font-size="13" class="px mid" >ago 2026</text><rect x="228" y="116" width="49.0" height="20" fill="none" stroke="#36c476"/><text x="236" y="130" font-size="11" class="px hi" >logro</text><text x="360" y="128" font-size="15" class="px hi" font-weight="600">Grado como Tecnólogo en Análisis y Desarrollo de Software</text><text x="360" y="147" font-size="12.5" class="px mid" >SENA</text></g>
<g class="row" style="animation-delay:0.42s"><line x1="28" y1="162" x2="932" y2="162" stroke="#1d6e42" stroke-opacity=".6"/><text x="28" y="184" font-size="13" class="px mid" >ene 2026 – jul 2026</text><rect x="228" y="170" width="88.6" height="20" fill="none" stroke="#1d6e42"/><text x="236" y="184" font-size="11" class="px mid" >experiencia</text><text x="360" y="182" font-size="15" class="px hi" font-weight="600">Practicante de apoyo de sistemas</text><text x="360" y="201" font-size="12.5" class="px mid" >Gimnasio Campestre Comfaoriente, Cúcuta</text></g>
<g class="row" style="animation-delay:0.54s"><line x1="28" y1="216" x2="932" y2="216" stroke="#1d6e42" stroke-opacity=".6"/><text x="28" y="238" font-size="13" class="px mid" >jul 2024 – hoy</text><rect x="228" y="224" width="75.4" height="20" fill="none" stroke="#1d6e42"/><text x="236" y="238" font-size="11" class="px mid" >educación</text><text x="360" y="236" font-size="15" class="px hi" font-weight="600">Ingeniería de Sistemas</text><text x="360" y="255" font-size="12.5" class="px mid" >Universidad de Pamplona</text></g>
<g class="row" style="animation-delay:0.66s"><line x1="28" y1="270" x2="932" y2="270" stroke="#1d6e42" stroke-opacity=".6"/><text x="28" y="292" font-size="13" class="px mid" >feb 2024 – hoy</text><rect x="228" y="278" width="88.6" height="20" fill="none" stroke="#1d6e42"/><text x="236" y="292" font-size="11" class="px mid" >experiencia</text><text x="360" y="290" font-size="15" class="px hi" font-weight="600">Auxiliar de ingeniería</text><text x="360" y="309" font-size="12.5" class="px mid" >Ing. Civil Mauricio Bolívar Cuéllar, Cúcuta</text></g>
<g class="row" style="animation-delay:0.78s"><line x1="28" y1="324" x2="932" y2="324" stroke="#1d6e42" stroke-opacity=".6"/><text x="28" y="346" font-size="13" class="px mid" >dic 2022</text><rect x="228" y="332" width="49.0" height="20" fill="none" stroke="#36c476"/><text x="236" y="346" font-size="11" class="px hi" >logro</text><text x="360" y="344" font-size="15" class="px hi" font-weight="600">Inglés nivel B1</text><text x="360" y="363" font-size="12.5" class="px mid" >Academia Inglés Para Todos</text></g>
<rect width="960" height="400" fill="url(#bloom)"/>
<rect width="960" height="400" fill="url(#scanp)" class="scan" opacity=".55"/>
<rect width="960" height="120" fill="url(#rollg)" class="roll"/>
<rect width="960" height="400" fill="url(#vig)"/>
</g>
<rect x="1" y="1" width="958" height="398" rx="14" fill="none" stroke="#1d6e42" stroke-width="2"/>
</svg>
