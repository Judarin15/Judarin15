<svg xmlns="http://www.w3.org/2000/svg" width="470" height="290" viewBox="0 0 470 290" role="img" aria-label="Galaxia Sonora: Tienda virtual que reúne en un solo lugar la venta de audiolibros en español publicados en Hotmart y Etsy. Proyecto propio.">
<title>Galaxia Sonora</title>
<style>@font-face{font-family:'VT';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PX';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'PX';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
.vt{font-family:'VT','Courier New',monospace}
.px{font-family:'PX','Consolas','Courier New',monospace}
.hi{fill:#c8ffdd} .ph{fill:#4dff91} .mid{fill:#36c476}
.glow{filter:url(#glow)}
.scan{animation:flicker 6s steps(1,end) infinite}
.roll{animation:roll 9s linear infinite}
.blink{animation:blink 1.05s steps(1,end) infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes flicker{0%{opacity:.55}7%{opacity:.45}8%{opacity:.6}43%{opacity:.5}44%{opacity:.56}71%{opacity:.48}72%{opacity:.58}}
@keyframes roll{from{transform:translateY(-40%)}to{transform:translateY(140%)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.sweep{animation:sweep 1.4s cubic-bezier(.77,0,.175,1) .3s both}@keyframes sweep{from{transform:translateY(-120px)}to{transform:translateY(330px)}}</style>
<defs>
  <pattern id="scanp" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".5"/></pattern>
  <radialGradient id="bloom" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#4dff91" stop-opacity=".09"/><stop offset=".55" stop-color="#4dff91" stop-opacity=".02"/><stop offset="1" stop-color="#4dff91" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx="50%" cy="50%" r="72%"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  <linearGradient id="rollg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4dff91" stop-opacity="0"/><stop offset=".6" stop-color="#4dff91" stop-opacity=".07"/><stop offset="1" stop-color="#4dff91" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="frame"><rect x="1" y="1" width="468" height="288" rx="14"/></clipPath>
</defs>
<g clip-path="url(#frame)">
<rect width="470" height="290" fill="#020d07"/>
<line x1="0" y1="40" x2="470" y2="40" stroke="#1d6e42"/>
<text x="20" y="26" font-size="13" class="px hi" >&gt; galaxia-sonora</text>
<text x="450" y="26" font-size="12" class="px mid" text-anchor="end">jul 2026</text>
<g><rect x="291.7" y="13" width="86.7" height="19" fill="none" stroke="#c8ffdd"/><rect x="299.7" y="19.5" width="6" height="6" fill="#c8ffdd" class="pulse"/><text x="311.7" y="26.5" font-size="10.5" class="px" fill="#c8ffdd" font-weight="600" letter-spacing=".6">PUBLICADO</text></g>
<text x="20" y="84" font-size="36" class="vt hi glow">Galaxia Sonora</text>
<text x="20" y="112" font-size="13" class="px ph" >Tienda virtual que reúne en un solo lugar la venta de</text>
<text x="20" y="132" font-size="13" class="px ph" >audiolibros en español publicados en Hotmart y Etsy.</text>
<text x="20" y="152" font-size="13" class="px ph" >Proyecto propio.</text>
<text x="20" y="192" font-size="12.5" class="px mid" >+ galaxiasonora.com</text>
<rect x="20.0" y="232" width="42.4" height="22" fill="none" stroke="#1d6e42"/><text x="28.0" y="247" font-size="11" class="px mid" >HTML</text>
<rect x="68.4" y="232" width="35.8" height="22" fill="none" stroke="#1d6e42"/><text x="76.4" y="247" font-size="11" class="px mid" >CSS</text>
<rect x="110.2" y="232" width="82.0" height="22" fill="none" stroke="#1d6e42"/><text x="118.2" y="247" font-size="11" class="px mid" >JavaScript</text>
<g><text x="338.4" y="272" font-size="12" class="px hi" font-weight="600">visitar sitio</text><line x1="338.4" y1="276" x2="432.0" y2="276" stroke="#c8ffdd"/><path d="M440 263 l6 5 -6 5" fill="none" stroke="#c8ffdd" stroke-width="2"/></g>
<rect x="0" y="0" width="470" height="90" class="sweep" fill="url(#rollg)"/>
<rect width="470" height="290" fill="url(#bloom)"/>
<rect width="470" height="290" fill="url(#scanp)" class="scan" opacity=".55"/>
<rect width="470" height="87" fill="url(#rollg)" class="roll"/>
<rect width="470" height="290" fill="url(#vig)"/>
</g>
<rect x="1" y="1" width="468" height="288" rx="14" fill="none" stroke="#1d6e42" stroke-width="2"/>
</svg>
